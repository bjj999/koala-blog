<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ config.base_url }}" class="logo">🐨 {{ config.title }}</a>
            <div class="nav-links">
                <a href="{{ config.base_url }}">首页</a>
                <a href="{{ config.base_url ~ '/posts' }}">文章</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }} · Powered by <a href="https://www.getzola.org">Zola</a></p>
        </div>
    </footer>
</body>
</html>

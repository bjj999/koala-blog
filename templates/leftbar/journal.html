{% if config.extra.olivine.journal | default(value=true) %}
<ul>
  <li><a id="olivine-today">{{<olivine.icon name="calendar-check"/>}} 今天</a></li>
  <li><a id="olivine-yesterday">{{<olivine.icon name="calendar-minus"/>}} 昨天</a></li>
  <li><a id="olivine-calendar" href="{{ get_url(path="journal") }}">{{<olivine.icon name="calendar-days"/>}} 所有日记</a></li>
